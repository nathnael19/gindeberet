# Auto-deploy to cPanel when code is pushed to main
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   VITE_API_URL, VITE_SITE_URL
# Optional:
#   FTP_PROTOCOL (ftps|ftp), FTP_PORT, FTP_FRONTEND_DIR, FTP_BACKEND_DIR
#
# After backend deploy: cPanel → Node.js App → Restart
# (NPM Install only when package.json dependencies change)

name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: Generate Prisma + deploy backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client (Linux engines for cPanel)
        working-directory: backend
        run: npx prisma generate
        env:
          # Dummy URL only for generate; real DB URL stays on the server .env
          DATABASE_URL: mysql://user:pass@localhost:3306/dummy

      - name: Deploy backend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./backend/
          server-dir: ${{ secrets.FTP_BACKEND_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/node_modules/**/**
            **/.env
            **/.env.local
            **/.env.production
            **/uploads/**
            **/uploads/**/**
            **/scripts/**
          dangerous-clean-slate: false

  deploy-frontend:
    name: Build & deploy frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        run: npm run build

      - name: Deploy frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./frontend/dist/
          server-dir: ${{ secrets.FTP_FRONTEND_DIR }}
          dangerous-clean-slate: false
