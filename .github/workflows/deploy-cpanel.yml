# Deploy Gindeberet to cPanel (PP Host)
#
# Triggers on push to main. Builds the Vite frontend and uploads:
#   - frontend/dist  → public_html
#   - backend/       → api app folder (excluding node_modules)
#
# After the first successful FTP of the backend, open cPanel → Setup Node.js App
# and click "Run NPM Install" + Restart (see DEPLOY.md).

name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  deploy-frontend:
    name: Build & deploy frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        run: npm run build

      - name: Deploy frontend to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./frontend/dist/
          server-dir: ${{ secrets.FTP_FRONTEND_DIR || '/public_html/' }}
          dangerous-clean-slate: false

  deploy-backend:
    name: Deploy backend source
    runs-on: ubuntu-latest
    needs: deploy-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy backend (no node_modules)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./backend/
          server-dir: ${{ secrets.FTP_BACKEND_DIR || '/api.gindeberetconstruction.com/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/node_modules/**/**
            **/.env
            **/.env.*
            !**/.env.production.example
            **/uploads/**
            **/prisma/*.db
          dangerous-clean-slate: false
