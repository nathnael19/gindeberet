# Apply awards + projects via the live API (no phpMyAdmin, no cPanel Run JS).
# Requires SETUP_SECRET on the server (.env / Node App env) AND as a GitHub Actions secret.
#
# Before first run: cPanel Node app RESTART (so /api/setup is mounted).
# Prefer Admin → Projects → "Import 35 sheet projects" if this workflow is blocked by WAF.

name: Fix cPanel content

on:
  workflow_dispatch:

jobs:
  fix-content:
    name: POST /api/setup/fix-content
    runs-on: ubuntu-latest
    steps:
      - name: Verify SETUP_SECRET
        env:
          SETUP_SECRET: ${{ secrets.SETUP_SECRET }}
        run: |
          if [ -z "$SETUP_SECRET" ]; then
            echo "::error::Add repository secret SETUP_SECRET (same value as cPanel Node App env SETUP_SECRET)."
            exit 1
          fi
          echo "SETUP_SECRET is set (${#SETUP_SECRET} chars)"

      - name: Apply awards and projects
        env:
          SETUP_SECRET: ${{ secrets.SETUP_SECRET }}
        run: |
          set -e
          url="https://api.gindeberetconstruction.com/api/setup/fix-content"
          echo "Calling $url"
          # Empty body + Content-Type: application/json causes Express to return HTTP 400.
          # Always send a JSON object. Also send browser-like headers to reduce WAF blocks.
          code=$(curl -sS -o /tmp/fix-content.json -w "%{http_code}" \
            -X POST "$url" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            -H "x-setup-secret: ${SETUP_SECRET}" \
            --data '{}')
          echo "HTTP $code"
          echo "----- response body -----"
          cat /tmp/fix-content.json || true
          echo
          echo "----- end response -----"
          if [ "$code" != "200" ]; then
            echo "::error::fix-content failed with HTTP $code. Prefer Admin → Projects → Import 35 sheet projects, or check SETUP_SECRET + Node RESTART."
            exit 1
          fi
          echo "fix-content OK"
