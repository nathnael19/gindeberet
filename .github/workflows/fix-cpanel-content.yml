# Queue awards + 35 projects via FTP (no live API call).
# Imunify360 blocks GitHub → api.gindeberetconstruction.com, so we do not curl the API.
#
# After this workflow is green: cPanel → Node.js App → RESTART once.
# On boot, Node reads data/pending-fix-content and runs fixPublicContent.

name: Fix cPanel content

on:
  workflow_dispatch:

jobs:
  queue-fix:
    name: FTP pending-fix-content flag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_BACKEND_DIR: ${{ secrets.FTP_BACKEND_DIR }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_BACKEND_DIR; do
            eval "val=\$$name"
            if [ -z "$val" ]; then
              echo "::error::$name is missing. Same secrets as Deploy to cPanel."
              missing=1
            else
              echo "$name is set (${#val} chars)"
            fi
          done
          exit $missing

      - name: Create pending-fix-content flag
        run: |
          mkdir -p backend/data
          date -u +"queued-by-github-actions %Y-%m-%dT%H:%M:%SZ" > backend/data/pending-fix-content
          ls -la backend/data/

      - name: Upload flag via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          security: loose
          local-dir: ./backend/data/
          server-dir: ${{ secrets.FTP_BACKEND_DIR }}data/
          dangerous-clean-slate: false

      - name: Next step
        run: |
          echo "::notice::Flag uploaded. cPanel → Setup Node.js App → RESTART now."
          echo "After restart, awards + 35 sheet projects are applied automatically."
